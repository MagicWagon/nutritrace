name: Build & Push to GHCR

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Dual-publish for one transition window so existing users on the
          # old `thebigjoe1/nutritrace` path keep getting updates. Drop the
          # old tags after v1.0 once docs/compose files are widely updated.
          tags: |
            ghcr.io/traceapps/nutritrace:latest
            ghcr.io/traceapps/nutritrace:${{ github.sha }}
            ghcr.io/thebigjoe1/nutritrace:latest
            ghcr.io/thebigjoe1/nutritrace:${{ github.sha }}

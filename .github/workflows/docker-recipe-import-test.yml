name: Build Recipe Import Test Image

on:
  push:
    branches: [Mealie-integration]
  workflow_dispatch:

concurrency:
  group: recipe-import-test-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push test image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/magicwagon/nutritrace:recipe-import-test
          labels: |
            org.opencontainers.image.source=https://github.com/MagicWagon/nutritrace
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=NutriTrace Recipe Import Test
          cache-from: type=gha,scope=recipe-import-test
          cache-to: type=gha,mode=max,scope=recipe-import-test
